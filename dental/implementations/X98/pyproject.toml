[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-implant-safety-research"
version = "0.1.0"
description = "Source-resolved digital implant canal clearance; physical safety remains explicit UNKNOWN"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
include = ["implant_safety*"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threefold-occlusion-module"
version = "0.1.0"
description = "Private research composition of registered bite, crown, conditional force and regional actuation ports"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "h5py>=3", "shapely>=2,<3"]
license = {file = "LICENSE_PRIVATE.txt"}

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]

[project.scripts]
threefold-occlusion = "occlusion_module.__main__:main"

[tool.setuptools.packages.find]
include = ["occlusion_module*"]

[tool.setuptools.package-data]
occlusion_module = ["SOURCE_MANIFEST.json"]
